<p-dialog
  [visible]="visible()"
  (visibleChange)="visibleChange.emit($event)"
  [header]="isEditMode ? 'Edit Item' : 'Create Item'"
  [modal]="true"
  [style]="{ width: '520px', maxHeight: '90vh' }"
  [contentStyle]="{ overflow: 'visible' }">

  <form
    [formGroup]="form"
    (ngSubmit)="submit()"
    class="flex flex-column gap-4 p-fluid pt-3">

    <!-- Row 1: Code & Name -->
    <div class="flex gap-3">
      <div class="w-4">
        <p-floatlabel variant="on">
          <input
            pInputText
            id="code"
            formControlName="code"
            class="w-full" />
          <label for="code">Code</label>
        </p-floatlabel>
      </div>

      <div class="w-8">
        <p-floatlabel variant="on">
          <input
            pInputText
            id="name"
            formControlName="name"
            class="w-full" />
          <label for="name">Name</label>
        </p-floatlabel>
      </div>
    </div>

    <!-- Row 2: Description -->
    <div>
      <p-floatlabel variant="on">
        <input
          pInputText
          id="description"
          formControlName="description"
          class="w-full" />
        <label for="description">Description</label>
      </p-floatlabel>
    </div>

    <!-- Row 3: Category & Item Type -->
    <div class="flex gap-3">
      <div class="w-6">
        <p-floatlabel variant="on">
          <p-select
            inputId="category"
            [options]="categories()"
            formControlName="categoryId"
            optionLabel="name"
            optionValue="id"
            appendTo="body"
            class="w-full">
          </p-select>
          <label for="category">Category</label>
        </p-floatlabel>
      </div>

      <div class="w-6">
        <p-floatlabel variant="on">
          <p-select
            inputId="itemType"
            [options]="itemTypes()"
            formControlName="itemTypeId"
            optionLabel="name"
            optionValue="id"
            appendTo="body"
            class="w-full">
          </p-select>
          <label for="itemType">Item Type</label>
        </p-floatlabel>
      </div>
    </div>

    <!-- Row 4: List Price, Currency, UOM & Active Toggle -->
    <div class="flex gap-3 align-items-center">
      <div class="w-4">
        <p-floatlabel variant="on">
          <p-inputnumber
            inputId="amount"
            formControlName="amount"
            mode="decimal"
            [minFractionDigits]="2"
            class="w-full">
          </p-inputnumber>
          <label for="amount">List Price</label>
        </p-floatlabel>
      </div>

      <div class="w-3">
        <p-floatlabel variant="on">
          <input
            pInputText
            id="currency"
            formControlName="currency"
            class="w-full" />
          <label for="currency">Currency</label>
        </p-floatlabel>
      </div>

      <div class="w-3">
        <p-floatlabel variant="on">
          <input
            pInputText
            id="uom"
            formControlName="unitOfMeasurement"
            class="w-full" />
          <label for="uom">UOM</label>
        </p-floatlabel>
      </div>

      <div class="w-2 flex flex-column align-items-center justify-content-center">
        <span class="text-xs font-semibold text-600 mb-1">Active</span>
        <p-toggleswitch
          inputId="active"
          formControlName="isActive">
        </p-toggleswitch>
      </div>
    </div>

    <!-- Footer Actions -->
    <div class="flex justify-content-end gap-2 mt-2">
      <p-button
        label="Cancel"
        [text]="true"
        (click)="close()">
      </p-button>

      <p-button
        label="Save"
        type="submit"
        [disabled]="form.invalid">
      </p-button>
    </div>
  </form>
</p-dialog>
