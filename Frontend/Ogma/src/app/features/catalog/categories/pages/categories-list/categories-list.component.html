<p-confirmDialog />

<div class="mb-3">
  <p-button label="Add Root Category" icon="pi pi-plus" (onClick)="openAddRoot()" />
</div>

<p-treeTable [value]="treeNodes()" [loading]="loading()">
  <ng-template pTemplate="header">
    <tr>
      <th>Name</th>
      <th style="width: 180px; text-align: center;">Actions</th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-rowNode let-rowData="rowData">
    <tr [ttRow]="rowNode">
      <td>
        <p-treeTableToggler [rowNode]="rowNode" />
        <span class="font-semibold">{{ rowData.name }}</span>
      </td>
      <td style="text-align: center;">

        <p-button 
          icon="pi pi-plus" 
          severity="secondary" 
          [text]="true" 
          pTooltip="Add Subcategory" 
          (onClick)="openAddChild(rowNode.node)" />

        <p-button 
          icon="pi pi-pencil" 
          severity="info" 
          [text]="true" 
          pTooltip="Edit Category" 
          (onClick)="openEdit(rowNode.node)" />

        <p-button 
          icon="pi pi-trash" 
          severity="danger" 
          [text]="true" 
          pTooltip="Delete Category" 
          (onClick)="confirmDelete(rowNode.node)" />
      </td>
    </tr>
  </ng-template>
</p-treeTable>

<p-dialog [(visible)]="isDialogOpen" [header]="dialogHeader()" [modal]="true" [style]="{ width: '420px' }">
  <div class="flex flex-col gap-3 mt-2">
    <div>
      <label for="catName" class="block font-bold mb-1">Category Name</label>
      <input pInputText id="catName" [(ngModel)]="categoryName" class="w-full" placeholder="e.g. Laptops" />
    </div>

    <div>
      <label class="block font-bold mb-1">Parent Category</label>
      <p-select 
        [options]="availableParents()" 
        [(ngModel)]="selectedParentId" 
        optionLabel="name" 
        optionValue="id" 
        [showClear]="true" 
        placeholder="None (Root Category)" 
        styleClass="w-full" />
    </div>
  </div>

  <ng-template pTemplate="footer">
    <p-button label="Cancel" severity="secondary" [text]="true" (onClick)="isDialogOpen.set(false)" />
    <p-button label="Save" icon="pi pi-check" (onClick)="saveCategory()" [disabled]="!categoryName().trim()" />
  </ng-template>
</p-dialog>
