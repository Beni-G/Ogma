<p-toast />
<p-confirmDialog />

<div class="card p-6 bg-white rounded-lg shadow-sm">
  <div class="flex justify-between items-center mb-4">
    <div>
      <h2 class="text-xl font-bold text-gray-800">Partner Role Types</h2>
      <p class="text-sm text-gray-500">Manage classification roles for partners (suppliers, customers and so on).</p>
    </div>
    <p-button label="Add Role Type" icon="pi pi-plus" (onClick)="openNew()" />
  </div>

  <p-table [value]="roles()" [loading]="loading()" [paginator]="true" [rows]="10" styleClass="p-datatable-gridlines">
    <ng-template pTemplate="header">
      <tr>
        <th style="width: 15%">Code</th>
        <th style="width: 35%">Name</th>
        <th style="width: 20%">Color Badge</th>
        <th style="width: 30%" class="text-center">Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-role>
      <tr>
        <td class="font-mono text-sm">{{ role.code }}</td>
        <td>{{ role.name }}</td>
        <td>
          <div class="flex items-center gap-2" *ngIf="role.color">
            <span class="w-4 h-4 rounded-full inline-block border border-gray-300" [style.background-color]="role.color"></span>
            <span class="text-xs text-gray-600 font-mono">{{ role.color }}</span>
          </div>
        </td>
        <td class="text-center flex justify-center gap-2">
          <p-button icon="pi pi-pencil" [text]="true" severity="secondary" (onClick)="openEdit(role)" />
          <p-button icon="pi pi-trash" [text]="true" severity="danger" (onClick)="deleteRole(role)" />
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="4" class="text-center text-gray-400 py-6">No partner role types found.</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-dialog [(visible)]="dialogVisible" [header]="selectedRole() ? 'Edit Role Type' : 'New Role Type'" [modal]="true" [style]="{width: '450px'}">
  @if (dialogVisible()) {
    <app-partner-role-type-form 
      [role]="selectedRole()" 
      (saved)="onSaveComplete()" 
      (cancelled)="dialogVisible.set(false)" />
  }
</p-dialog>
