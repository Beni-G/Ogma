<div [formGroup]="parentForm" class="flex flex-col gap-4 pt-2">
  <div class="flex items-center gap-4">
    <div class="flex items-center gap-2">
      <p-checkbox formControlName="isNaturalPerson" [binary]="true" inputId="isNat" />
      <label for="isNat" class="text-sm font-medium text-gray-700 cursor-pointer">Is Natural Person</label>
    </div>

    @if (isEdit) {
      <div class="flex items-center gap-2">
        <p-checkbox formControlName="isActive" [binary]="true" inputId="isActive" />
        <label for="isActive" class="text-sm font-medium text-gray-700 cursor-pointer">Is Active</label>
      </div>
    }
  </div>

  @if (parentForm.get('isNaturalPerson')?.value) {
    <div formGroupName="individualName" class="grid grid-cols-2 gap-4">
      <div class="flex flex-col gap-1">
        <label class="text-sm font-medium text-gray-700">First Name</label>
        <input pInputText formControlName="firstName" placeholder="First Name" class="w-full" />
      </div>
      <div class="flex flex-col gap-1">
        <label class="text-sm font-medium text-gray-700">Last Name</label>
        <input pInputText formControlName="lastName" placeholder="Last Name" class="w-full" />
      </div>
    </div>
  } @else {
    <div class="grid grid-cols-2 gap-4">
      <div class="flex flex-col gap-1 col-span-2">
        <label class="text-sm font-medium text-gray-700">Company Name</label>
        <input pInputText formControlName="companyName" placeholder="Company Name" class="w-full" />
      </div>
    </div>
  }

  @if (!isEdit) {
    <div class="grid grid-cols-2 gap-4">
      <div class="flex flex-col gap-1 col-span-2">
        <label class="text-sm font-medium text-gray-700">Role Type</label>
        <p-select formControlName="roleId" [options]="roleTypes" optionLabel="name" optionValue="id" placeholder="Select Role" appendTo="body" styleClass="w-full" />
      </div>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div class="col-span-2 p-3 border rounded bg-gray-50 flex flex-col gap-3" formGroupName="identifier">
        <span class="text-sm font-semibold text-gray-700">Primary Identifier (Required)</span>
        
        <div class="grid grid-cols-3 gap-2">
          <input pInputText formControlName="type" placeholder="Type (e.g. VAT, CUI)" class="w-full text-sm col-span-1" />
          <input pInputText formControlName="value" placeholder="Value" class="w-full text-sm col-span-2" />
        </div>

        <div formGroupName="validityPeriod" class="grid grid-cols-2 gap-2 pt-1 border-t border-gray-200">
          <div class="flex flex-col gap-1">
            <label class="text-xs text-gray-500 font-medium">Valid From (Optional)</label>
            <input pInputText type="date" formControlName="start" class="w-full text-sm" />
          </div>
          <div class="flex flex-col gap-1">
            <label class="text-xs text-gray-500 font-medium">Valid To (Optional)</label>
            <input pInputText type="date" formControlName="end" class="w-full text-sm" />
          </div>
        </div>
      </div>
    </div>
  } @else {
    <div class="grid grid-cols-2 gap-4">
      <div class="flex flex-col gap-1 col-span-2">
        <label class="text-sm font-medium text-gray-700">Role Types</label>
        <p-multiSelect formControlName="roleIds" [options]="roleTypes" optionLabel="name" optionValue="id" placeholder="Select Roles" appendTo="body" styleClass="w-full" />
      </div>
    </div>
  }
</div>
