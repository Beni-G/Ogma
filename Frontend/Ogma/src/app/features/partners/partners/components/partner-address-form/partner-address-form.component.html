<div [formGroup]="parentForm" class="grid grid-cols-2 gap-3 pt-2">
  <div class="flex flex-col gap-1"><input pInputText formControlName="street" placeholder="Street" /></div>
  <div class="flex flex-col gap-1"><input pInputText formControlName="number" placeholder="Number" /></div>
  <div class="flex flex-col gap-1"><input pInputText formControlName="city" placeholder="City" /></div>
  <div class="flex flex-col gap-1"><input pInputText formControlName="region" placeholder="Region" /></div>
  <div class="flex flex-col gap-1"><input pInputText formControlName="postalCode" placeholder="Postal Code" /></div>
  <div class="flex flex-col gap-1"><input pInputText formControlName="countryCode" placeholder="Country Code (e.g. DE, RO)" /></div>
  <div class="flex flex-col gap-1"><input pInputText formControlName="building" placeholder="Building" /></div>
  <div class="flex flex-col gap-1"><input pInputText formControlName="apartment" placeholder="Apartment" /></div>
</div>
