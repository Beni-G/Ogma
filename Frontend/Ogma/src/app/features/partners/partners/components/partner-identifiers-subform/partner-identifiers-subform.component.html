<div [formGroup]="parentForm">
  <div formArrayName="identifiers" class="flex flex-col gap-3 pt-2 max-h-80 overflow-y-auto">
    @for (ident of identifiers.controls; track $index) {
    <div [formGroupName]="$index" class="flex flex-col gap-2 p-3 border rounded bg-gray-50">
      <div class="flex items-center gap-2">
        <div class="w-1/3">
          <input pInputText formControlName="type" placeholder="Type" class="w-full text-sm" />
        </div>
        <div class="w-1/2">
          <input pInputText formControlName="value" placeholder="Value" class="w-full text-sm" />
        </div>
        <div class="flex items-center gap-2">
          <p-checkbox formControlName="isPrimary" [binary]="true" inputId="isActive" (change)="onPrimaryChange($index)"
            id="primary-{{$index}}" />
          <label for="primary-{{$index}}" class="text-sm font-medium text-gray-700 cursor-pointer">Primary</label>
        </div>
        <p-button icon="pi pi-trash" severity="danger" [text]="true" (onClick)="remove($index)" />
      </div>

      <div formGroupName="validityPeriod" class="grid grid-cols-2 gap-2 pt-2 border-t border-gray-200">
        <div class="flex flex-col gap-1">
          <label class="text-xs text-gray-500 font-medium">Valid From (Optional)</label>
          <input pInputText type="date" formControlName="start" class="text-sm" />
        </div>
        <div class="flex flex-col gap-1">
          <label class="text-xs text-gray-500 font-medium">Valid To (Optional)</label>
          <input pInputText type="date" formControlName="end" class="text-sm" />
        </div>
      </div>
    </div>
    }
    <p-button label="Add Identifier" icon="pi pi-plus" severity="secondary" [outlined]="true" size="small"
      (onClick)="add()" />
  </div>
</div>
