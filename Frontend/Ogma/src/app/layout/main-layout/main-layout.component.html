<p-menubar [model]="navItems()">

  <ng-template pTemplate="start">
    <p-button icon="pi pi-bars" [text]="true" severity="secondary" (onClick)="toggleSidebar()" />
  </ng-template>

  <ng-template pTemplate="end">
    <div class="user-menu-container">
      <p-button [label]="displayName()" icon="pi pi-user" iconPos="right" severity="secondary" [text]="true"
        (onClick)="userMenu.toggle($event)">
      </p-button>

      <p-menu #userMenu [model]="userMenuItems()" [popup]="true"></p-menu>
    </div>
  </ng-template>
</p-menubar>

<p-drawer [(visible)]="sidebarVisible" header="Navigation">
  <nav class="flex flex-col gap-2 pt-2">
    <div class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1 px-3">
      Catalog
    </div>

    <a routerLink="catalog/categories" routerLinkActive="bg-indigo-50 text-indigo-600 font-medium"
      (click)="sidebarVisible.set(false)"
      class="flex items-center gap-3 px-3 py-2 rounded-md text-gray-700 hover:bg-gray-100 transition-colors">
      <i class="pi pi-sitemap"></i>
      <span>Categories</span>
    </a>

    <a routerLink="catalog/item-types" routerLinkActive="bg-indigo-50 text-indigo-600 font-medium"
      (click)="sidebarVisible.set(false)"
      class="flex items-center gap-3 px-3 py-2 rounded-md text-gray-700 hover:bg-gray-100 transition-colors">
      <i class="pi pi-tags"></i>
      <span>Item Types</span>
    </a>

    <a routerLink="catalog/items" routerLinkActive="bg-indigo-50 text-indigo-600 font-medium"
      (click)="sidebarVisible.set(false)"
      class="flex items-center gap-3 px-3 py-2 rounded-md text-gray-700 hover:bg-gray-100 transition-colors">
      <i class="pi pi-box"></i>
      <span>Items</span>
    </a>

    <div class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1 px-3">
      Partners
    </div>

    <a routerLink="partners/partner-role-types" routerLinkActive="bg-indigo-50 text-indigo-600 font-medium"
      (click)="sidebarVisible.set(false)"
      class="flex items-center gap-3 px-3 py-2 rounded-md text-gray-700 hover:bg-gray-100 transition-colors">
      <i class="pi pi-tags"></i>
      <span>Partner Role Types</span>
    </a>
  </nav>
</p-drawer>


<main class="layout-content">
  <router-outlet></router-outlet>
</main>
